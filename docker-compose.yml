version: '3.9'

services:
  app:
    build: .
    container_name: super-erp-app
    image: raseefk/super-erp:latest
    ports:
      - "8085:8085"
    networks:
      - erp-network
    volumes:
      - super_erp_uploads:/app/uploads
      - super_erp_logs:/app/logs
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@erp-db:1521/XEPDB1
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=oracle.jdbc.OracleDriver
      - SPRING_DATASOURCE_USERNAME=super_erp
      - SPRING_DATASOURCE_PASSWORD=StrongP@ssword123!
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.OracleDialect
      - APP_JWT_SECRET=super-erp-jwt-secret-key-must-be-256-bits-long-for-hs256-algorithm
      - APP_ADMIN_PASSWORD=SuperAdmin@2026!
      - APP_UPLOAD_DIR=/app/uploads
      - LOGGING_FILE_NAME=/app/logs/super-erp.log
      # ── Company Details ──
      - APP_COMPANY_NAME=${COMPANY_NAME:-Super ERP}
      - APP_COMPANY_ADDRESS=${COMPANY_ADDRESS:-Main Business District, City, State}
      - APP_COMPANY_PHONE=${COMPANY_PHONE:-+91 XXXXX XXXXX}
      - APP_COMPANY_EMAIL=${COMPANY_EMAIL:-info@supererp.com}
      - APP_COMPANY_GSTNUMBER=${COMPANY_GSTIN:-YOUR_GSTIN_HERE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  erp-network:
    external: true
    name: erp-shared-network

volumes:
  super_erp_uploads:
    driver: local
  super_erp_logs:
    driver: local
