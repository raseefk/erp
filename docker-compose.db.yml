services:
  postgres:
    image: postgres:18-alpine
    container_name: erp-db
    restart: unless-stopped
    # ⚠️ Port 5432 intentionally NOT exposed to the host.
    # The app connects via Docker internal network (erp-db:5432).
    # Exposing 5432 publicly allows bots to exhaust max_connections.
    environment:
      # The Superuser for manual setup/migrations
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: -SuperErp@Postgres2026
      # The specific database name for your ERP
      POSTGRES_DB: super_erp
    deploy:
      resources:
        limits:
          memory: 256M
    command: >-
      postgres
      -c shared_buffers=64MB
      -c max_connections=20
      -c work_mem=4MB
      -c authentication_timeout=5s
    volumes:
      # PG 18+ requires mount at /var/lib/postgresql (NOT /data).
      # The image creates its own subdirectory: /var/lib/postgresql/18/main
      - postgres_data:/var/lib/postgresql
    networks:
      - erp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d super_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  erp-network:
    name: erp-shared-network
    driver: bridge

volumes:
  postgres_data:
    driver: local