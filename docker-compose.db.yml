services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: erp-db
    restart: unless-stopped
    environment:
      ORACLE_RANDOM_PASSWORD: "true"
      ORACLE_SYS_PASSWORD: SuperErp@Oracle2026
      ORACLE_PDB: XEPDB1
      ORACLE_PWD: SuperErp@Oracle2026
      APP_USER: erp_app
      APP_USER_PASSWORD: SuperErp@App2026
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - erp-network
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/SuperErp@Oracle2026@XEPDB1", "as", "sysdba", "exit"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  erp-network:
    name: erp-shared-network
    driver: bridge

volumes:
  oracle_data:
    driver: local
