<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:insert="~{fragments/layout :: head('Digital Signatures')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('dms')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Digital Signatures')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>

    <!-- Stat Cards -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon" style="background:rgba(217,119,6,0.1);color:#d97706;"><i class="bi bi-hourglass-split"></i></div>
          <div>
            <div class="stat-num" th:text="${stats.pending ?: 0}">0</div>
            <div class="stat-lbl">Awaiting Signature</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card" style="border-left-color:#2563eb;">
          <div class="stat-icon" style="background:rgba(37,99,235,0.1);color:#2563eb;"><i class="bi bi-pen"></i></div>
          <div>
            <div class="stat-num" th:text="${stats.signed ?: 0}">0</div>
            <div class="stat-lbl">Signed</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card" style="border-left-color:#16a34a;">
          <div class="stat-icon" style="background:rgba(22,163,74,0.1);color:#16a34a;"><i class="bi bi-shield-check"></i></div>
          <div>
            <div class="stat-num" th:text="${stats.verified ?: 0}">0</div>
            <div class="stat-lbl">Verified</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card" style="border-left-color:#dc2626;">
          <div class="stat-icon" style="background:rgba(220,38,38,0.1);color:#dc2626;"><i class="bi bi-x-circle"></i></div>
          <div>
            <div class="stat-num" th:text="${stats.rejected ?: 0}">0</div>
            <div class="stat-lbl">Rejected</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
      <!-- Status filter tabs -->
      <div class="btn-group" role="group">
        <a th:href="@{/admin/dms/digital-signatures}" class="btn btn-sm"
           th:classappend="${selectedStatus == null ? 'btn-navy' : 'btn-outline-navy'}">All</a>
        <a th:href="@{/admin/dms/digital-signatures(status='PENDING')}" class="btn btn-sm"
           th:classappend="${selectedStatus == 'PENDING' ? 'btn-navy' : 'btn-outline-navy'}">Pending</a>
        <a th:href="@{/admin/dms/digital-signatures(status='SIGNED')}" class="btn btn-sm"
           th:classappend="${selectedStatus == 'SIGNED' ? 'btn-navy' : 'btn-outline-navy'}">Signed</a>
        <a th:href="@{/admin/dms/digital-signatures(status='VERIFIED')}" class="btn btn-sm"
           th:classappend="${selectedStatus == 'VERIFIED' ? 'btn-navy' : 'btn-outline-navy'}">Verified</a>
        <a th:href="@{/admin/dms/digital-signatures(status='REJECTED')}" class="btn btn-sm"
           th:classappend="${selectedStatus == 'REJECTED' ? 'btn-navy' : 'btn-outline-navy'}">Rejected</a>
      </div>
      <button class="btn btn-sm btn-gold" data-bs-toggle="modal" data-bs-target="#requestSignatureModal"
              sec:authorize="hasAuthority('DMS_DIGITAL_SIGNATURE_SIGN')">
        <i class="bi bi-pen me-1"></i>Request Signature
      </button>
    </div>

    <!-- Signatures Table -->
    <div class="card card-levanto">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-pen me-2"></i>Digital Signatures
          (<span th:text="${signaturePage.totalElements}">0</span>)</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-levanto mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Document</th>
                <th>Signer</th>
                <th>Type</th>
                <th>Status</th>
                <th>Signed At</th>
                <th>Verified At</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="sig : ${signaturePage.content}">
                <td class="text-muted small" th:text="${sig.id}">-</td>
                <td>
                  <a th:href="@{/admin/dms/documents/{id}(id=${sig.document.id})}"
                     th:text="${sig.document.title}" class="fw-bold">-</a>
                  <div class="small text-muted" th:text="'v' + ${sig.document.currentVersion}">-</div>
                </td>
                <td>
                  <div class="fw-bold" th:text="${sig.signerName}">-</div>
                  <div class="small text-muted" th:text="${sig.signerEmail}">-</div>
                  <div class="small text-muted" th:if="${sig.signerDesignation}" th:text="${sig.signerDesignation}">-</div>
                </td>
                <td>
                  <span class="badge bg-secondary" th:text="${sig.signatureType}">-</span>
                </td>
                <td>
                  <span class="badge"
                        th:classappend="${sig.signatureStatus == 'VERIFIED' ? 'bg-success' :
                                         (sig.signatureStatus == 'SIGNED'   ? 'bg-primary' :
                                         (sig.signatureStatus == 'PENDING'  ? 'bg-warning text-dark' : 'bg-danger'))}"
                        th:text="${sig.signatureStatus}">-</span>
                </td>
                <td class="small" th:text="${sig.signedAt != null ? #temporals.format(sig.signedAt,'dd/MM/yy HH:mm') : '—'}">-</td>
                <td class="small" th:text="${sig.verifiedAt != null ? #temporals.format(sig.verifiedAt,'dd/MM/yy HH:mm') : '—'}">-</td>
                <td>
                  <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/dms/digital-signatures/{id}(id=${sig.id})}"
                       class="btn btn-outline-navy" title="View Detail">
                      <i class="bi bi-eye"></i>
                    </a>
                    <!-- Sign button: only for PENDING signatures -->
                    <button th:if="${sig.signatureStatus == 'PENDING'}"
                            class="btn btn-outline-primary" title="Sign"
                            th:attr="onclick='openSignModal(' + ${sig.id} + ')'"
                            sec:authorize="hasAuthority('DMS_DIGITAL_SIGNATURE_SIGN')">
                      <i class="bi bi-pen"></i>
                    </button>
                    <!-- Verify button: only for SIGNED signatures -->
                    <button th:if="${sig.signatureStatus == 'SIGNED'}"
                            class="btn btn-outline-success" title="Verify"
                            th:attr="onclick='verifySignature(' + ${sig.id} + ')'"
                            sec:authorize="hasAuthority('DMS_DIGITAL_SIGNATURE_VERIFY')">
                      <i class="bi bi-shield-check"></i>
                    </button>
                    <!-- Reject button -->
                    <button th:if="${sig.signatureStatus == 'SIGNED' or sig.signatureStatus == 'PENDING'}"
                            class="btn btn-outline-danger" title="Reject"
                            th:attr="onclick='rejectSignature(' + ${sig.id} + ')'"
                            sec:authorize="hasAuthority('DMS_DIGITAL_SIGNATURE_VERIFY')">
                      <i class="bi bi-x-circle"></i>
                    </button>
                  </div>
                </td>
              </tr>
              <tr th:if="${signaturePage.totalElements == 0}">
                <td colspan="8" class="text-center py-5 text-muted">
                  <i class="bi bi-pen display-6 d-block mb-2 opacity-25"></i>
                  No signatures found.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${signaturePage.totalPages > 1}" class="mt-3">
      <ul class="pagination pagination-sm justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
          <a class="page-link" th:href="@{/admin/dms/digital-signatures(page=${currentPage - 1},status=${selectedStatus})}">Prev</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, signaturePage.totalPages - 1)}"
            th:classappend="${i == currentPage ? 'active' : ''}">
          <a class="page-link" th:href="@{/admin/dms/digital-signatures(page=${i},status=${selectedStatus})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${currentPage == signaturePage.totalPages - 1 ? 'disabled' : ''}">
          <a class="page-link" th:href="@{/admin/dms/digital-signatures(page=${currentPage + 1},status=${selectedStatus})}">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>

<!-- ── Request Signature Modal ───────────────────────────────────────────── -->
<div class="modal fade" id="requestSignatureModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pen me-2"></i>Request Signature</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-12">
            <label class="form-label fw-bold">Document *</label>
            <select id="reqDocumentId" class="form-select">
              <option value="">Select a document…</option>
              <option th:each="doc : ${documents}"
                      th:value="${doc.id}"
                      th:text="${doc.title + ' (v' + doc.currentVersion + ')'}">-</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Signer Name *</label>
            <input type="text" id="reqSignerName" class="form-control" placeholder="Full name"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Signer Email *</label>
            <input type="email" id="reqSignerEmail" class="form-control" placeholder="email@company.com"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Designation</label>
            <input type="text" id="reqSignerDesignation" class="form-control" placeholder="e.g. Project Manager"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Signature Type</label>
            <select id="reqSignatureType" class="form-select">
              <option value="ELECTRONIC">Electronic (draw/type)</option>
              <option value="DIGITAL_CERTIFICATE">Digital Certificate</option>
              <option value="BIOMETRIC">Biometric</option>
            </select>
          </div>
          <div class="col-md-12">
            <label class="form-label fw-bold">Purpose / Instructions</label>
            <textarea id="reqPurpose" class="form-control" rows="2" placeholder="Why this document needs to be signed…"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-gold" onclick="submitSignatureRequest()">
          <i class="bi bi-send me-1"></i>Send Request
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Sign Modal (draws/captures signature) ─────────────────────────────── -->
<div class="modal fade" id="signModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pen me-2"></i>Sign Document</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-bold">Draw Your Signature</label>
          <div class="border rounded" style="background:#f8fafc;">
            <canvas id="signaturePad" width="700" height="180" style="width:100%;touch-action:none;cursor:crosshair;"></canvas>
          </div>
          <div class="d-flex gap-2 mt-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="clearSignaturePad()">
              <i class="bi bi-eraser me-1"></i>Clear
            </button>
          </div>
        </div>
        <div class="mb-0">
          <label class="form-label fw-bold small">I confirm that I am signing this document voluntarily and this represents my digital signature.</label>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="signConfirm"/>
            <label class="form-check-label small" for="signConfirm">I agree to sign this document electronically.</label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-gold" onclick="submitSign()">
          <i class="bi bi-check2 me-1"></i>Apply Signature
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Reject Modal ──────────────────────────────────────────────────────── -->
<div class="modal fade" id="rejectModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-x-circle me-2 text-danger"></i>Reject Signature</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <label class="form-label fw-bold">Reason for Rejection *</label>
        <textarea id="rejectReason" class="form-control" rows="3" placeholder="Explain why this signature is being rejected…"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" onclick="submitReject()">
          <i class="bi bi-x-circle me-1"></i>Reject
        </button>
      </div>
    </div>
  </div>
</div>

<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script>
let currentSignatureId = null;
let isDrawing = false;
let lastX = 0, lastY = 0;

// ── Signature pad setup ─────────────────────────────────────────────────────
const canvas = document.getElementById('signaturePad');
const ctx = canvas.getContext('2d');
ctx.strokeStyle = '#1a3a5c';
ctx.lineWidth = 2;
ctx.lineCap = 'round';
ctx.lineJoin = 'round';

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
  }
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

canvas.addEventListener('mousedown', e => { isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; });
canvas.addEventListener('mousemove', e => {
  if (!isDrawing) return;
  const p = getPos(e);
  ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
  lastX = p.x; lastY = p.y;
});
canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isDrawing) return;
  const p = getPos(e);
  ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
  lastX = p.x; lastY = p.y;
});
canvas.addEventListener('touchend', () => isDrawing = false);

function clearSignaturePad() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function isCanvasBlank() {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (let i = 0; i < data.length; i += 4) { if (data[i + 3] !== 0) return false; }
  return true;
}

// ── Open sign modal ─────────────────────────────────────────────────────────
function openSignModal(sigId) {
  currentSignatureId = sigId;
  clearSignaturePad();
  document.getElementById('signConfirm').checked = false;
  const modal = new bootstrap.Modal(document.getElementById('signModal'));
  modal.show();
}

// ── Submit signature ────────────────────────────────────────────────────────
function submitSign() {
  if (isCanvasBlank()) { showToast('Please draw your signature first.', 'warning'); return; }
  if (!document.getElementById('signConfirm').checked) { showToast('Please confirm your agreement.', 'warning'); return; }
  const signatureData = canvas.toDataURL('image/png');
  fetch('/admin/dms/digital-signatures/' + currentSignatureId + '/sign', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ signatureData: signatureData, geoLocation: '' })
  }).then(r => r.json()).then(d => {
    bootstrap.Modal.getInstance(document.getElementById('signModal')).hide();
    if (d.success) { showToast('Document signed successfully!', 'success'); setTimeout(() => location.reload(), 1000); }
    else showToast(d.message, 'danger');
  });
}

// ── Verify signature ────────────────────────────────────────────────────────
function verifySignature(sigId) {
  if (!confirm('Verify this signature? This will check document integrity.')) return;
  fetch('/admin/dms/digital-signatures/' + sigId + '/verify', { method: 'POST' })
    .then(r => r.json()).then(d => {
      if (d.success) { showToast('Signature verified!', 'success'); setTimeout(() => location.reload(), 1000); }
      else showToast(d.message, 'danger');
    });
}

// ── Reject signature ─────────────────────────────────────────────────────────
function rejectSignature(sigId) {
  currentSignatureId = sigId;
  document.getElementById('rejectReason').value = '';
  new bootstrap.Modal(document.getElementById('rejectModal')).show();
}

function submitReject() {
  const reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { showToast('Please enter a reason.', 'warning'); return; }
  fetch('/admin/dms/digital-signatures/' + currentSignatureId + '/reject?reason=' + encodeURIComponent(reason), { method: 'POST' })
    .then(r => r.json()).then(d => {
      bootstrap.Modal.getInstance(document.getElementById('rejectModal')).hide();
      if (d.success) { showToast('Signature rejected.', 'success'); setTimeout(() => location.reload(), 1000); }
      else showToast(d.message, 'danger');
    });
}

// ── Request new signature ────────────────────────────────────────────────────
function submitSignatureRequest() {
  const docId = document.getElementById('reqDocumentId').value;
  const name = document.getElementById('reqSignerName').value.trim();
  const email = document.getElementById('reqSignerEmail').value.trim();
  if (!docId || !name || !email) { showToast('Document, signer name and email are required.', 'warning'); return; }
  const payload = {
    document: { id: parseInt(docId) },
    signerName: name,
    signerEmail: email,
    signerDesignation: document.getElementById('reqSignerDesignation').value.trim(),
    signatureType: document.getElementById('reqSignatureType').value,
    signaturePurpose: document.getElementById('reqPurpose').value.trim()
  };
  fetch('/admin/dms/digital-signatures/request', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => r.json()).then(d => {
    bootstrap.Modal.getInstance(document.getElementById('requestSignatureModal')).hide();
    if (d.success) { showToast('Signature request created!', 'success'); setTimeout(() => location.reload(), 1000); }
    else showToast(d.message, 'danger');
  });
}

// ── Toast utility ────────────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `alert alert-${type} position-fixed top-0 end-0 m-3 shadow`;
  t.style.cssText = 'z-index:9999;min-width:260px;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
