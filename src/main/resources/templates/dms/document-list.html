<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('Documents')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('dms')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Document Vault')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <!-- Filters -->
      <form th:action="@{/admin/dms/documents}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
          <input type="text" name="q" class="form-control form-control-sm" placeholder="Search title, tags…" th:value="${q}"/>
        </div>
        <div class="col-md-2">
          <select name="category" class="form-select form-select-sm">
            <option value="">All Categories</option>
            <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.name()}" th:selected="${selectedCategory?.name() == cat.name()}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <select name="folderId" class="form-select form-select-sm">
            <option value="">All Folders</option>
            <option th:each="f : ${folders}" th:value="${f.id}" th:text="${f.name}" th:selected="${selectedFolderId == f.id}"></option>
          </select>
        </div>
        <div class="col-md-1">
          <button type="submit" class="btn btn-sm btn-gold w-100">Filter</button>
        </div>
        <div class="col-md-2 text-end">
          <a th:href="@{/admin/dms/documents/upload}" class="btn btn-sm btn-gold"><i class="bi bi-cloud-upload me-1"></i>Upload</a>
        </div>
      </form>
      <!-- Current Folder breadcrumb -->
      <nav th:if="${currentFolder != null}" aria-label="breadcrumb" class="mb-2">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/admin/dms/documents}">All Documents</a></li>
          <li class="breadcrumb-item active" th:text="${currentFolder.name}">-</li>
        </ol>
      </nav>
      <div class="card card-levanto">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="bi bi-files me-2"></i>Documents (<span th:text="${docPage.totalElements}">0</span>)</span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-levanto mb-0">
              <thead><tr>
                <th>Title</th><th>Category</th><th>Folder</th>
                <th>Version</th><th>Expiry</th><th>Access</th><th>Actions</th>
              </tr></thead>
              <tbody>
                <tr th:each="doc : ${docPage.content}">
                  <td>
                    <a th:href="@{/admin/dms/documents/{id}(id=${doc.id})}" th:text="${doc.title}" class="fw-bold">-</a>
                    <div th:if="${doc.tags}" class="small text-muted" th:text="${doc.tags}">-</div>
                  </td>
                  <td><span class="badge badge-navy" th:text="${doc.category}">-</span></td>
                  <td th:text="${doc.folder?.name ?: '—'}">-</td>
                  <td class="text-center"><span class="badge bg-secondary" th:text="'v' + ${doc.currentVersion}">v1</span></td>
                  <td>
                    <span th:if="${doc.expiryDate == null}" class="text-muted small">—</span>
                    <span th:if="${doc.expiryDate != null}" class="badge"
                          th:classappend="${doc.expiryDate.isBefore(#temporals.createToday().plusDays(7)) ? 'bg-danger' : (doc.expiryDate.isBefore(#temporals.createToday().plusDays(30)) ? 'bg-warning text-dark' : 'bg-success')}"
                          th:text="${doc.expiryDate}">-</span>
                  </td>
                  <td><span class="badge" th:classappend="${doc.accessLevel.name() == 'PUBLIC' ? 'bg-success' : (doc.accessLevel.name() == 'PRIVATE' ? 'bg-danger' : 'bg-info text-dark')}" th:text="${doc.accessLevel}">-</span></td>
                  <td>
                    <div class="btn-group btn-group-sm">
                      <a th:href="@{/admin/dms/documents/{id}/download(id=${doc.id})}" class="btn btn-outline-navy" title="Download"><i class="bi bi-download"></i></a>
                      <a th:href="@{/admin/dms/documents/{id}(id=${doc.id})}" class="btn btn-outline-navy" title="View"><i class="bi bi-eye"></i></a>
                      <a th:href="@{/admin/dms/documents/{id}/edit(id=${doc.id})}" class="btn btn-navy" title="Edit"><i class="bi bi-pencil"></i></a>
                    </div>
                  </td>
                </tr>
                <tr th:if="${docPage.totalElements == 0}">
                  <td colspan="7" class="text-center py-4 text-muted"><i class="bi bi-folder-x me-2"></i>No documents found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <!-- Pagination -->
      <nav th:if="${docPage.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm justify-content-center">
          <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
            <a class="page-link" th:href="@{/admin/dms/documents(page=${currentPage - 1},q=${q},category=${selectedCategory},folderId=${selectedFolderId})}">Prev</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, docPage.totalPages - 1)}"
              th:classappend="${i == currentPage ? 'active' : ''}">
            <a class="page-link" th:href="@{/admin/dms/documents(page=${i},q=${q},category=${selectedCategory},folderId=${selectedFolderId})}" th:text="${i + 1}">1</a>
          </li>
          <li class="page-item" th:classappend="${currentPage == docPage.totalPages - 1 ? 'disabled' : ''}">
            <a class="page-link" th:href="@{/admin/dms/documents(page=${currentPage + 1},q=${q},category=${selectedCategory},folderId=${selectedFolderId})}">Next</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
