<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('Document Detail')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('dms')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Document Detail')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/admin/dms/documents}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
        <div class="btn-group">
          <a th:href="@{/admin/dms/documents/{id}/download(id=${document.id})}" class="btn btn-sm btn-gold"><i class="bi bi-download me-1"></i>Download Latest</a>
          <a th:href="@{/admin/dms/documents/{id}/edit(id=${document.id})}" class="btn btn-sm btn-navy"><i class="bi bi-pencil me-1"></i>Edit</a>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteDoc()"><i class="bi bi-trash me-1"></i>Delete</button>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-8">
          <!-- Document Info -->
          <div class="card card-levanto mb-3">
            <div class="card-header d-flex justify-content-between">
              <span><i class="bi bi-file-earmark-text me-2"></i><span th:text="${document.title}">-</span></span>
              <span class="badge badge-navy" th:text="${document.category}">-</span>
            </div>
            <div class="card-body">
              <p th:if="${document.description}" th:text="${document.description}" class="text-muted mb-3">-</p>
              <div class="row g-2 small">
                <div class="col-md-4"><strong>Folder:</strong> <span th:text="${document.folder?.name ?: 'Root'}">-</span></div>
                <div class="col-md-4"><strong>Access:</strong> <span class="badge" th:classappend="${document.accessLevel.name() == 'PUBLIC' ? 'bg-success' : 'bg-warning text-dark'}" th:text="${document.accessLevel}">-</span></div>
                <div class="col-md-4"><strong>Version:</strong> <span class="badge bg-secondary" th:text="'v' + ${document.currentVersion}">v1</span></div>
                <div class="col-md-4"><strong>Tags:</strong> <span th:text="${document.tags ?: '—'}">-</span></div>
                <div class="col-md-4" th:if="${document.expiryDate != null}">
                  <strong>Expires:</strong>
                  <span class="badge" th:classappend="${document.expiryDate.isBefore(#temporals.createToday().plusDays(30)) ? 'bg-danger' : 'bg-success'}" th:text="${document.expiryDate}">-</span>
                </div>
                <div class="col-md-4" th:if="${document.linkedEntityType != null}">
                  <strong>Linked To:</strong> <span th:text="${document.linkedEntityType + ' #' + document.linkedEntityId}">-</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Upload New Version -->
          <div class="card card-levanto mb-3">
            <div class="card-header"><i class="bi bi-upload me-2"></i>Upload New Version</div>
            <div class="card-body">
              <form th:action="@{/admin/dms/documents/{id}/new-version(id=${document.id})}" method="post" enctype="multipart/form-data" class="d-flex gap-3 align-items-end">
                <div class="flex-grow-1">
                  <label class="form-label small fw-bold">File *</label>
                  <input type="file" name="file" class="form-control form-control-sm" required/>
                </div>
                <div class="flex-grow-1">
                  <label class="form-label small fw-bold">Change Notes</label>
                  <input type="text" name="changeNotes" class="form-control form-control-sm" placeholder="What changed in this version?"/>
                </div>
                <button type="submit" class="btn btn-sm btn-navy"><i class="bi bi-cloud-upload me-1"></i>Upload v<span th:text="${document.currentVersion + 1}">2</span></button>
              </form>
            </div>
          </div>
        </div>

        <!-- Version History -->
        <div class="col-md-4">
          <div class="card card-levanto">
            <div class="card-header"><i class="bi bi-clock-history me-2"></i>Version History</div>
            <div class="card-body p-0">
              <div th:each="v : ${versions}" class="d-flex align-items-start gap-2 p-3 border-bottom">
                <div class="badge bg-secondary" th:text="'v' + ${v.version}" style="min-width:30px;text-align:center;">v1</div>
                <div class="flex-grow-1">
                  <div class="fw-bold small" th:text="${v.fileName}">-</div>
                  <div class="small text-muted" th:text="${v.uploadedBy + ' — ' + #temporals.format(v.uploadedAt, 'dd/MM/yy HH:mm')}">-</div>
                  <div class="small text-muted" th:if="${v.changeNotes}" th:text="${v.changeNotes}">-</div>
                </div>
                <a th:href="@{/admin/dms/documents/{id}/download(id=${document.id},version=${v.version})}" class="btn btn-sm btn-outline-navy" title="Download this version"><i class="bi bi-download"></i></a>
              </div>
              <div th:if="${#lists.isEmpty(versions)}" class="p-3 text-muted small text-center">No version history.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script th:inline="javascript">
const docId = [[${document.id}]];
function deleteDoc() {
  if (!confirm('Delete this document? This action is irreversible.')) return;
  fetch('/admin/dms/documents/' + docId + '/delete', { method: 'POST' })
    .then(r => r.json()).then(d => {
      if (d.success) window.location.href = '/admin/dms/documents';
      else alert(d.message);
    });
}
</script>
</body>
</html>
