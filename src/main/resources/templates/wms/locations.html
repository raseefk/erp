<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:insert="~{fragments/layout :: head('Locations')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('wms-warehouses')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Warehouse Locations')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <div class="d-flex align-items-center gap-3">
        <a href="/admin/wms/warehouses" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a>
        <div>
          <div class="fw-bold" th:text="${warehouse.name}">-</div>
          <div class="small text-muted" th:text="${warehouse.code}">-</div>
        </div>
      </div>
      <button class="btn btn-sm btn-gold" data-bs-toggle="modal" data-bs-target="#addLocationModal"
              sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_WMS_LOCATIONS_MANAGE')">
        <i class="bi bi-plus-lg me-1"></i>Add Location
      </button>
    </div>

    <div class="card card-levanto">
      <div class="card-header"><i class="bi bi-geo-alt me-2"></i>Locations (<span th:text="${#lists.size(locations)}">0</span>)</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-levanto mb-0">
            <thead><tr>
              <th>Barcode</th><th>Zone</th><th>Aisle</th><th>Rack</th>
              <th>Shelf</th><th>Bin</th><th>Full Address</th><th>Capacity</th><th>Actions</th>
            </tr></thead>
            <tbody>
              <tr th:each="loc : ${locations}">
                <td><code class="small" th:text="${loc.barcode}">-</code></td>
                <td th:text="${loc.zone ?: '-'}">-</td>
                <td th:text="${loc.aisle ?: '-'}">-</td>
                <td th:text="${loc.rack ?: '-'}">-</td>
                <td th:text="${loc.shelf ?: '-'}">-</td>
                <td th:text="${loc.bin ?: '-'}">-</td>
                <td class="fw-bold small" th:text="${loc.fullAddress}">-</td>
                <td class="small" th:text="${loc.maxCapacityUnits != null ? loc.maxCapacityUnits : 'Unlimited'}">-</td>
                <td>
                  <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-navy" title="Show QR"
                            th:onclick="|showQr(${loc.id})|">
                      <i class="bi bi-qr-code"></i>
                    </button>
                    <a th:href="@{/admin/wms/stock(warehouseId=${warehouse.id})}"
                       class="btn btn-outline-secondary" title="View Stock">
                      <i class="bi bi-boxes"></i>
                    </a>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(locations)}">
                <td colspan="9" class="text-center py-5 text-muted">
                  <i class="bi bi-geo-alt d-block mb-2" style="font-size:2rem;opacity:.25;"></i>
                  No locations yet. Add your first location.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Location Modal -->
<div class="modal fade" id="addLocationModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-geo-alt me-2"></i>Add Location</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label fw-bold">Barcode *</label>
            <input type="text" id="locBarcode" class="form-control"
                   placeholder="e.g. A-01-R3-S2-B01 (or leave blank to auto-generate)"/>
            <div class="form-text">Unique scannable code for this location.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Zone</label>
            <input type="text" id="locZone" class="form-control" placeholder="A"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Aisle</label>
            <input type="text" id="locAisle" class="form-control" placeholder="A1"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Rack</label>
            <input type="text" id="locRack" class="form-control" placeholder="R3"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Shelf</label>
            <input type="text" id="locShelf" class="form-control" placeholder="S2"/>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Bin</label>
            <input type="text" id="locBin" class="form-control" placeholder="B01"/>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Full Address (override)</label>
            <input type="text" id="locFullAddress" class="form-control"
                   placeholder="Auto-generated from zone/aisle/rack/shelf/bin"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Max Capacity (units)</label>
            <input type="number" id="locCapacity" class="form-control" placeholder="Leave blank for unlimited"/>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-gold" onclick="saveLocation()">
          <i class="bi bi-save me-1"></i>Save Location
        </button>
      </div>
    </div>
  </div>
</div>

<!-- QR Modal -->
<div class="modal fade" id="qrModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content text-center">
      <div class="modal-header">
        <h5 class="modal-title">Location QR Code</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <img id="qrImage" src="" alt="QR Code" class="img-fluid"/>
        <div id="qrText" class="small text-muted mt-2"></div>
      </div>
      <div class="modal-footer justify-content-center">
        <a id="qrDownload" download="location-qr.png" class="btn btn-gold btn-sm">
          <i class="bi bi-download me-1"></i>Download
        </a>
      </div>
    </div>
  </div>
</div>

<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script th:inline="javascript">
const warehouseId = /*[[${warehouse.id}]]*/ 0;

function saveLocation() {
  const payload = {
    barcode:          document.getElementById('locBarcode').value.trim(),
    zone:             document.getElementById('locZone').value.trim(),
    aisle:            document.getElementById('locAisle').value.trim(),
    rack:             document.getElementById('locRack').value.trim(),
    shelf:            document.getElementById('locShelf').value.trim(),
    bin:              document.getElementById('locBin').value.trim(),
    fullAddress:      document.getElementById('locFullAddress').value.trim(),
    maxCapacityUnits: document.getElementById('locCapacity').value || null
  };
  fetch('/admin/wms/warehouses/' + warehouseId + '/locations/save', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(r => r.json()).then(d => {
    bootstrap.Modal.getInstance(document.getElementById('addLocationModal')).hide();
    if (d.success) { showToast('Location saved!', 'success'); setTimeout(() => location.reload(), 800); }
    else showToast(d.message, 'danger');
  });
}

function showQr(locId) {
  fetch('/admin/wms/locations/' + locId + '/qr')
    .then(r => r.json()).then(d => {
      if (d.success) {
        const img = document.getElementById('qrImage');
        img.src = d.data;
        document.getElementById('qrDownload').href = d.data;
        new bootstrap.Modal(document.getElementById('qrModal')).show();
      } else showToast(d.message, 'danger');
    });
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'alert alert-' + (type || 'success') + ' position-fixed top-0 end-0 m-3 shadow';
  t.style.cssText = 'z-index:9999;min-width:260px;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
