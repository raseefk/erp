<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('New Transfer')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('wms-transfers')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('New Stock Transfer')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>

    <div class="mb-3"><a href="/admin/wms/transfers" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>

    <div class="card card-levanto">
      <div class="card-header"><i class="bi bi-arrow-left-right me-2"></i>New Stock Transfer Order</div>
      <div class="card-body">
        <form th:action="@{/admin/wms/transfers/save}" method="post" id="transferForm">
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-bold">From Location *</label>
              <select name="fromLocation.id" class="form-select" required>
                <option value="">-- Select source location --</option>
                <option th:each="loc : ${locations}"
                        th:value="${loc.id}"
                        th:text="${loc.warehouse?.name + ' / ' + loc.fullAddress}">-</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">To Location *</label>
              <select name="toLocation.id" class="form-select" required>
                <option value="">-- Select destination location --</option>
                <option th:each="loc : ${locations}"
                        th:value="${loc.id}"
                        th:text="${loc.warehouse?.name + ' / ' + loc.fullAddress}">-</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">Expected Arrival Date</label>
              <input type="date" name="expectedArrivalDate" class="form-control"/>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-bold">Remarks</label>
              <input type="text" name="remarks" class="form-control" placeholder="Optional notes..."/>
            </div>
          </div>

          <h6 class="fw-bold border-bottom pb-2 mb-3"><i class="bi bi-list-check me-2"></i>Items to Transfer</h6>
          <div class="table-responsive">
            <table class="table table-sm table-bordered" id="itemsTable">
              <thead class="bg-light">
                <tr>
                  <th>Item *</th><th style="width:15%;">Qty *</th><th style="width:12%;">Unit</th><th style="width:5%;">Del</th>
                </tr>
              </thead>
              <tbody id="itemsBody">
                <tr>
                  <td>
                    <select name="items[0].inventoryItem.id" class="form-select form-select-sm" required>
                      <option value="">Select item...</option>
                      <option th:each="item : ${items}" th:value="${item.id}" th:text="${item.name}">-</option>
                    </select>
                  </td>
                  <td><input type="number" step="0.001" name="items[0].requestedQty" class="form-control form-control-sm" min="0.001" value="1" required/></td>
                  <td><input type="text" name="items[0].unit" class="form-control form-control-sm" value="NOS"/></td>
                  <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>
                </tr>
              </tbody>
            </table>
          </div>
          <button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addRow()">
            <i class="bi bi-plus-lg me-1"></i>Add Item
          </button>

          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-gold px-4"><i class="bi bi-send me-1"></i>Create Transfer</button>
            <a href="/admin/wms/transfers" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script th:inline="javascript">
const allItems = /*[[${items}]]*/ [];
let rowIdx = 1;

function addRow() {
  const tbody = document.getElementById('itemsBody');
  const i = rowIdx++;
  const opts = allItems.map(it => `<option value="${it.id}">${it.name}</option>`).join('');
  tbody.insertAdjacentHTML('beforeend', `
    <tr>
      <td><select name="items[${i}].inventoryItem.id" class="form-select form-select-sm" required>
        <option value="">Select item...</option>${opts}</select></td>
      <td><input type="number" step="0.001" name="items[${i}].requestedQty" class="form-control form-control-sm" min="0.001" value="1" required/></td>
      <td><input type="text" name="items[${i}].unit" class="form-control form-control-sm" value="NOS"/></td>
      <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>
    </tr>`);
}

function removeRow(btn) {
  const rows = document.querySelectorAll('#itemsBody tr');
  if (rows.length > 1) btn.closest('tr').remove();
}
</script>
</body>
</html>
