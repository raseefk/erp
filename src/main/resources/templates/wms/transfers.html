<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:insert="~{fragments/layout :: head('Stock Transfers')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('wms-transfers')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Stock Transfers')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <form th:action="@{/admin/wms/transfers}" method="get" class="d-flex gap-2">
        <input type="text" name="q" class="form-control form-control-sm"
               placeholder="Search transfer #..." th:value="${q}" style="width:220px;"/>
        <button type="submit" class="btn btn-sm btn-gold">Search</button>
        <a href="/admin/wms/transfers" class="btn btn-sm btn-outline-secondary">Clear</a>
      </form>
      <a href="/admin/wms/transfers/new" class="btn btn-sm btn-gold"
         sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_WMS_TRANSFERS_MANAGE')">
        <i class="bi bi-plus-lg me-1"></i>New Transfer
      </a>
    </div>

    <div class="card card-levanto">
      <div class="card-header">
        <i class="bi bi-arrow-left-right me-2"></i>Stock Transfers
        (<span th:text="${transferPage.totalElements}">0</span>)
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-levanto mb-0">
            <thead><tr>
              <th>Transfer #</th><th>From</th><th>To</th>
              <th>Date</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody>
              <tr th:each="t : ${transferPage.content}">
                <td class="fw-bold">
                  <a th:href="@{/admin/wms/transfers/{id}(id=${t.id})}"
                     th:text="${t.transferNumber}">-</a>
                </td>
                <td class="small" th:text="${t.fromLocation?.warehouse?.name + ' / ' + t.fromLocation?.fullAddress}">-</td>
                <td class="small" th:text="${t.toLocation?.warehouse?.name + ' / ' + t.toLocation?.fullAddress}">-</td>
                <td class="small" th:text="${t.transferDate ?: '-'}">-</td>
                <td>
                  <span class="badge"
                        th:classappend="${t.status.name() == 'RECEIVED' ? 'bg-success' :
                                         t.status.name() == 'IN_TRANSIT' ? 'bg-primary' :
                                         t.status.name() == 'SUBMITTED' ? 'bg-info text-dark' :
                                         t.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-secondary'}"
                        th:text="${t.status}">-</span>
                </td>
                <td>
                  <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/wms/transfers/{id}(id=${t.id})}"
                       class="btn btn-outline-navy" title="View">
                      <i class="bi bi-eye"></i>
                    </a>
                    <button th:if="${t.status.name() == 'DRAFT'}"
                            class="btn btn-outline-primary" title="Submit"
                            th:onclick="|submitTransfer(${t.id})|"
                            sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_WMS_TRANSFERS_MANAGE')">
                      <i class="bi bi-send"></i>
                    </button>
                    <button th:if="${t.status.name() == 'SUBMITTED'}"
                            class="btn btn-outline-warning" title="Dispatch"
                            th:onclick="|dispatchTransfer(${t.id})|"
                            sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_WMS_TRANSFERS_MANAGE')">
                      <i class="bi bi-truck"></i>
                    </button>
                    <button th:if="${t.status.name() == 'IN_TRANSIT'}"
                            class="btn btn-outline-success" title="Receive"
                            th:onclick="|receiveTransfer(${t.id})|"
                            sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_WMS_TRANSFERS_MANAGE')">
                      <i class="bi bi-box-seam"></i>
                    </button>
                  </div>
                </td>
              </tr>
              <tr th:if="${transferPage.totalElements == 0}">
                <td colspan="6" class="text-center py-5 text-muted">No transfers found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${transferPage.totalPages > 1}" class="mt-3">
      <ul class="pagination pagination-sm justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/wms/transfers(page=${currentPage-1},q=${q})}">Prev</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, transferPage.totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link" th:href="@{/admin/wms/transfers(page=${i},q=${q})}" th:text="${i+1}">1</a>
        </li>
        <li class="page-item" th:classappend="${currentPage == transferPage.totalPages - 1} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/wms/transfers(page=${currentPage+1},q=${q})}">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script>
function doAction(url, msg) {
  fetch(url, { method: 'POST' }).then(r => r.json()).then(d => {
    if (d.success) { showToast(d.message || msg, 'success'); setTimeout(() => location.reload(), 900); }
    else showToast(d.message, 'danger');
  });
}
function submitTransfer(id)  { doAction('/admin/wms/transfers/' + id + '/submit', 'Submitted.'); }
function dispatchTransfer(id) { doAction('/admin/wms/transfers/' + id + '/dispatch', 'Dispatched.'); }
function receiveTransfer(id)  { doAction('/admin/wms/transfers/' + id + '/receive', 'Received.'); }

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'alert alert-' + (type || 'success') + ' position-fixed top-0 end-0 m-3 shadow';
  t.style.cssText = 'z-index:9999;min-width:260px;'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
