<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('Blanket PO Form')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('scm-blanket-po')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Blanket PO / Rate Contract')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="mb-3"><a th:href="@{/admin/scm/blanket-po}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
      <div class="card card-levanto">
        <div class="card-header"><i class="bi bi-file-earmark-ruled me-2"></i>Rate Contract Details</div>
        <div class="card-body">
          <form th:action="@{/admin/scm/blanket-po/save}" method="post">
            <input type="hidden" name="id" th:value="${bpo.id}"/>
            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label fw-bold">Title *</label>
                <input type="text" name="title" class="form-control" th:value="${bpo.title}" required placeholder="e.g. Annual Steel Supply Contract FY2025"/>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">Vendor *</label>
                <select name="vendor.id" class="form-select" required>
                  <option value="">-- Select Vendor --</option>
                  <option th:each="v : ${vendors}" th:value="${v.id}" th:text="${v.name}" th:selected="${bpo.vendor?.id == v.id}"></option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Start Date *</label>
                <input type="date" name="startDate" class="form-control" th:value="${bpo.startDate}" required/>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">End Date *</label>
                <input type="date" name="endDate" class="form-control" th:value="${bpo.endDate}" required/>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Total Contract Value (₹) *</label>
                <input type="number" step="0.01" name="totalValue" class="form-control" th:value="${bpo.totalValue}" required/>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Payment Terms</label>
                <input type="text" name="paymentTerms" class="form-control" th:value="${bpo.paymentTerms}" placeholder="e.g. Net 45 days"/>
              </div>
            </div>
            <h6 class="text-navy fw-bold border-bottom pb-1 mb-3"><i class="bi bi-list-check me-2"></i>Rate Items</h6>
            <div class="table-responsive">
              <table class="table table-sm table-bordered" id="bpoItemsTable">
                <thead class="bg-light"><tr>
                  <th style="width:35%;">Item</th><th>Description</th>
                  <th style="width:12%;">Agreed Price (₹)</th>
                  <th style="width:10%;">Max Qty</th><th style="width:8%;">Unit</th>
                  <th style="width:5%;"></th>
                </tr></thead>
                <tbody id="bpoItemsBody">
                  <tr th:each="item, stat : ${bpo.items}">
                    <td>
                      <select th:name="'items[' + ${stat.index} + '].inventoryItem.id'" class="form-select form-select-sm">
                        <option value="">-- Custom --</option>
                        <option th:each="inv : ${inventoryItems}" th:value="${inv.id}" th:text="${inv.name}" th:selected="${item.inventoryItem?.id == inv.id}"></option>
                      </select>
                    </td>
                    <td><input type="text" th:name="'items[' + ${stat.index} + '].description'" class="form-control form-control-sm" th:value="${item.description}" required/></td>
                    <td><input type="number" step="0.01" th:name="'items[' + ${stat.index} + '].agreedUnitPrice'" class="form-control form-control-sm" th:value="${item.agreedUnitPrice}" required/></td>
                    <td><input type="number" step="0.001" th:name="'items[' + ${stat.index} + '].maxQuantity'" class="form-control form-control-sm" th:value="${item.maxQuantity}"/></td>
                    <td><input type="text" th:name="'items[' + ${stat.index} + '].unit'" class="form-control form-control-sm" th:value="${item.unit ?: 'NOS'}"/></td>
                    <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>
                  </tr>
                </tbody>
              </table>
              <button type="button" class="btn btn-sm btn-outline-navy mt-2" onclick="addBpoRow()"><i class="bi bi-plus-lg me-1"></i>Add Item</button>
            </div>
            <div class="mt-3">
              <label class="form-label fw-bold">Terms &amp; Conditions</label>
              <textarea name="terms" class="form-control" rows="3" th:text="${bpo.terms}" placeholder="Special terms, penalties, delivery conditions..."></textarea>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-gold px-4">Save Rate Contract</button>
              <a th:href="@{/admin/scm/blanket-po}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script th:inline="javascript">
let bpoIdx = [[${#lists.size(bpo.items)}]];
const invItems = /*[[${inventoryItems}]]*/ [];
function addBpoRow() {
  const tbody = document.getElementById('bpoItemsBody');
  const opts = invItems.map(i => `<option value="${i.id}">${i.name}</option>`).join('');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><select name="items[${bpoIdx}].inventoryItem.id" class="form-select form-select-sm"><option value="">-- Custom --</option>${opts}</select></td>
    <td><input type="text" name="items[${bpoIdx}].description" class="form-control form-control-sm" required/></td>
    <td><input type="number" step="0.01" name="items[${bpoIdx}].agreedUnitPrice" class="form-control form-control-sm" value="0" required/></td>
    <td><input type="number" step="0.001" name="items[${bpoIdx}].maxQuantity" class="form-control form-control-sm"/></td>
    <td><input type="text" name="items[${bpoIdx}].unit" class="form-control form-control-sm" value="NOS"/></td>
    <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>`;
  tbody.appendChild(tr); bpoIdx++;
}
function removeRow(btn) { if (document.querySelectorAll('#bpoItemsBody tr').length > 1) btn.closest('tr').remove(); }
</script>
</body>
</html>
