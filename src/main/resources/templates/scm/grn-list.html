<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:insert="~{fragments/layout :: head('Goods Receipt Notes')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('scm-grn')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Goods Receipt Notes')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <form th:action="@{/admin/scm/grn}" method="get" class="d-flex gap-2">
          <input type="text" name="q" class="form-control form-control-sm" placeholder="Search GRN, PO, Vendor…" th:value="${q}" style="width:260px;"/>
          <button type="submit" class="btn btn-sm btn-gold">Search</button>
        </form>
        <a th:href="@{/admin/scm/grn/new}" class="btn btn-sm btn-gold"><i class="bi bi-plus-lg me-1"></i>New GRN</a>
      </div>
      <div class="card card-levanto">
        <div class="card-header"><i class="bi bi-box-seam me-2"></i>Goods Receipt Notes</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-levanto mb-0">
              <thead><tr>
                <th>GRN Number</th><th>PO Number</th><th>Vendor</th>
                <th>Received Date</th><th>Total Value</th><th>Status</th><th>Actions</th>
              </tr></thead>
              <tbody>
                <tr th:each="g : ${grnPage.content}">
                  <td><strong th:text="${g.grnNumber}">-</strong></td>
                  <td th:text="${g.purchaseOrder?.poNumber ?: '-'}">-</td>
                  <td th:text="${g.purchaseOrder?.vendor?.name ?: '-'}">-</td>
                  <td th:text="${g.receivedDate}">-</td>
                  <td th:text="${'₹ ' + #numbers.formatDecimal(g.totalReceivedValue, 1, 2)}">0.00</td>
                  <td>
                    <span class="badge" th:classappend="${
                      g.status.name() == 'DRAFT' ? 'bg-secondary' :
                      g.status.name() == 'SUBMITTED' ? 'bg-info text-dark' :
                      g.status.name() == 'ACCEPTED' ? 'bg-success' : 'bg-danger'
                    }" th:text="${g.status}">-</span>
                  </td>
                  <td>
                    <div class="btn-group btn-group-sm">
                      <a th:href="@{/admin/scm/grn/{id}(id=${g.id})}" class="btn btn-outline-navy" title="View"><i class="bi bi-eye"></i></a>
                    </div>
                  </td>
                </tr>
                <tr th:if="${grnPage.totalElements == 0}">
                  <td colspan="7" class="text-center py-4 text-muted">No GRNs found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
