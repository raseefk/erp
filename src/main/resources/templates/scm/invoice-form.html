<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('Add Vendor Invoice')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('scm-invoice')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Add Vendor Invoice')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="mb-3"><a th:href="@{/admin/scm/invoices}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
      <div class="card card-levanto">
        <div class="card-header"><i class="bi bi-file-earmark-check me-2"></i>Vendor Invoice — 3-Way Match</div>
        <div class="card-body">
          <form th:action="@{/admin/scm/invoices/save}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${invoice.id}"/>
            <div class="row g-3 mb-3">
              <div class="col-md-3">
                <label class="form-label fw-bold">Invoice Number *</label>
                <input type="text" name="invoiceNumber" class="form-control" th:value="${invoice.invoiceNumber}" required/>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">Purchase Order *</label>
                <select name="purchaseOrder.id" class="form-select" required>
                  <option value="">-- Select PO --</option>
                  <option th:each="po : ${purchaseOrders}" th:value="${po.id}" th:text="${po.poNumber + ' — ' + po.vendor.name}"
                          th:selected="${invoice.purchaseOrder?.id == po.id}"></option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Vendor</label>
                <select name="vendor.id" class="form-select">
                  <option value="">-- Select Vendor --</option>
                  <option th:each="v : ${vendors}" th:value="${v.id}" th:text="${v.name}" th:selected="${invoice.vendor?.id == v.id}"></option>
                </select>
              </div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-3">
                <label class="form-label fw-bold">Invoice Date</label>
                <input type="date" name="invoiceDate" class="form-control" th:value="${invoice.invoiceDate}"/>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Due Date</label>
                <input type="date" name="dueDate" class="form-control" th:value="${invoice.dueDate}"/>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Invoice Amount (₹) *</label>
                <input type="number" step="0.01" name="invoiceAmount" class="form-control" th:value="${invoice.invoiceAmount ?: '0.00'}" required oninput="calcTotal()"/>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Tax Amount (₹)</label>
                <input type="number" step="0.01" name="taxAmount" class="form-control" th:value="${invoice.taxAmount ?: '0.00'}" oninput="calcTotal()"/>
              </div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-3">
                <label class="form-label fw-bold">Total Amount (₹)</label>
                <input type="number" step="0.01" name="totalAmount" id="totalAmount" class="form-control fw-bold" th:value="${invoice.totalAmount ?: '0.00'}" readonly/>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">Invoice Document (PDF/Image)</label>
                <input type="file" name="invoiceFile" class="form-control" accept="application/pdf,image/*"/>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Notes</label>
              <textarea name="notes" class="form-control" rows="2" th:text="${invoice.notes}"></textarea>
            </div>
            <div class="alert alert-info small"><i class="bi bi-info-circle me-2"></i>After saving, the system will automatically perform a 3-way match against the PO and GRN amounts.</div>
            <div class="mt-3 d-flex gap-2">
              <button type="submit" class="btn btn-gold px-4"><i class="bi bi-check2-circle me-1"></i>Submit Invoice</button>
              <a th:href="@{/admin/scm/invoices}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script>
function calcTotal() {
  const base = parseFloat(document.querySelector('[name=invoiceAmount]').value) || 0;
  const tax  = parseFloat(document.querySelector('[name=taxAmount]').value) || 0;
  document.getElementById('totalAmount').value = (base + tax).toFixed(2);
}
</script>
</body>
</html>
