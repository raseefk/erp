<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('PO Approvals')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('scm-approvals')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Procurement Approval Queue')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="card card-levanto">
        <div class="card-header"><i class="bi bi-check2-circle me-2"></i>Pending PO Approvals</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-levanto mb-0">
              <thead><tr>
                <th>PO Number</th><th>Vendor</th><th>PO Amount</th>
                <th>Approval Level</th><th>Approver Role</th><th>Requested</th><th>Actions</th>
              </tr></thead>
              <tbody>
                <tr th:each="appr : ${pendingApprovals}">
                  <td><strong><a th:href="@{/admin/scm/po/{id}(id=${appr.purchaseOrder.id})}" th:text="${appr.purchaseOrder.poNumber}">-</a></strong></td>
                  <td th:text="${appr.purchaseOrder.vendor?.name ?: '-'}">-</td>
                  <td><strong th:text="${'₹ ' + #numbers.formatDecimal(appr.purchaseOrder.totalAmount, 1, 2)}">0.00</strong></td>
                  <td><span class="badge bg-info text-dark" th:text="'L' + ${appr.approvalLevel}">L1</span></td>
                  <td th:text="${appr.approverRole}">-</td>
                  <td th:text="${appr.createdAt != null ? #temporals.format(appr.createdAt, 'dd/MM/yyyy') : '-'}">-</td>
                  <td>
                    <div class="btn-group btn-group-sm">
                      <button class="btn btn-success" th:onclick="'approveRequest(' + ${appr.id} + ')'"><i class="bi bi-check-lg me-1"></i>Approve</button>
                      <button class="btn btn-danger" th:onclick="'rejectRequest(' + ${appr.id} + ')'"><i class="bi bi-x-lg me-1"></i>Reject</button>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pendingApprovals)}">
                  <td colspan="7" class="text-center py-4 text-muted"><i class="bi bi-check-all me-2"></i>No pending approvals.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script>
function approveRequest(id) {
  const comments = prompt('Approval comments (optional):') || '';
  if (!confirm('Approve this procurement request?')) return;
  const fd = new FormData(); fd.append('comments', comments);
  fetch('/admin/scm/approvals/' + id + '/approve', { method: 'POST', body: fd })
    .then(r => r.json()).then(d => { if (d.success) location.reload(); else alert(d.message); });
}

function rejectRequest(id) {
  const comments = prompt('Rejection reason (required):');
  if (!comments) return;
  const fd = new FormData(); fd.append('comments', comments);
  fetch('/admin/scm/approvals/' + id + '/reject', { method: 'POST', body: fd })
    .then(r => r.json()).then(d => { if (d.success) location.reload(); else alert(d.message); });
}
</script>
</body>
</html>
