<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('RFQ Form')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('scm-rfq')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Request for Quotation')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="mb-3"><a th:href="@{/admin/scm/rfq}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
      <div class="card card-levanto">
        <div class="card-header"><i class="bi bi-envelope-open-text me-2"></i>RFQ Details</div>
        <div class="card-body">
          <form th:action="@{/admin/scm/rfq/save}" method="post">
            <input type="hidden" name="id" th:value="${rfq.id}"/>
            <div class="row g-3 mb-3">
              <div class="col-md-8">
                <label class="form-label fw-bold">Title *</label>
                <input type="text" name="title" class="form-control" th:value="${rfq.title}" required placeholder="e.g. Office Furniture Supply Q3 2025"/>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">Response Deadline</label>
                <input type="date" name="deadline" class="form-control" th:value="${rfq.deadline}"/>
              </div>
              <div class="col-12">
                <label class="form-label fw-bold">Description / Scope</label>
                <textarea name="description" class="form-control" rows="2" th:text="${rfq.description}" placeholder="Detailed scope of supply..."></textarea>
              </div>
            </div>
            <h6 class="text-navy fw-bold border-bottom pb-1 mb-3"><i class="bi bi-list-check me-2"></i>Required Items</h6>
            <div class="table-responsive">
              <table class="table table-sm table-bordered" id="rfqItemsTable">
                <thead class="bg-light"><tr>
                  <th style="width:35%;">Inventory Item</th><th>Description</th>
                  <th style="width:12%;">Quantity</th><th style="width:10%;">Unit</th>
                  <th style="width:5%;"></th>
                </tr></thead>
                <tbody id="rfqItemsBody">
                  <tr th:each="item, stat : ${rfq.items}">
                    <td>
                      <select th:name="'items[' + ${stat.index} + '].inventoryItem.id'" class="form-select form-select-sm" onchange="fillDesc(this)">
                        <option value="">-- Custom --</option>
                        <option th:each="inv : ${inventoryItems}" th:value="${inv.id}" th:text="${inv.name}" th:selected="${item.inventoryItem?.id == inv.id}" th:data-unit="${inv.unit}"></option>
                      </select>
                    </td>
                    <td><input type="text" th:name="'items[' + ${stat.index} + '].description'" class="form-control form-control-sm" th:value="${item.description}" required/></td>
                    <td><input type="number" step="0.001" th:name="'items[' + ${stat.index} + '].quantity'" class="form-control form-control-sm" th:value="${item.quantity ?: 1}" required/></td>
                    <td><input type="text" th:name="'items[' + ${stat.index} + '].unit'" class="form-control form-control-sm" th:value="${item.unit ?: 'NOS'}"/></td>
                    <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>
                  </tr>
                </tbody>
              </table>
              <button type="button" class="btn btn-sm btn-outline-navy mt-2" onclick="addRfqRow()"><i class="bi bi-plus-lg me-1"></i>Add Item</button>
            </div>
            <div class="mt-3">
              <label class="form-label fw-bold">Notes to Vendors</label>
              <textarea name="notes" class="form-control" rows="2" th:text="${rfq.notes}" placeholder="Terms, delivery requirements..."></textarea>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-gold px-4">Save RFQ</button>
              <a th:href="@{/admin/scm/rfq}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script th:inline="javascript">
let rowIdx = [[${#lists.size(rfq.items)}]];
const inventoryItems = /*[[${inventoryItems}]]*/ [];

function addRfqRow() {
  const tbody = document.getElementById('rfqItemsBody');
  const tr = document.createElement('tr');
  const opts = inventoryItems.map(i => `<option value="${i.id}" data-unit="${i.unit}">${i.name}</option>`).join('');
  tr.innerHTML = `
    <td><select name="items[${rowIdx}].inventoryItem.id" class="form-select form-select-sm" onchange="fillDesc(this)"><option value="">-- Custom --</option>${opts}</select></td>
    <td><input type="text" name="items[${rowIdx}].description" class="form-control form-control-sm" required/></td>
    <td><input type="number" step="0.001" name="items[${rowIdx}].quantity" class="form-control form-control-sm" value="1" required/></td>
    <td><input type="text" name="items[${rowIdx}].unit" class="form-control form-select-sm" value="NOS"/></td>
    <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>`;
  tbody.appendChild(tr); rowIdx++;
}
function removeRow(btn) {
  if (document.querySelectorAll('#rfqItemsBody tr').length > 1) btn.closest('tr').remove();
}
function fillDesc(sel) {
  const opt = sel.options[sel.selectedIndex];
  const row = sel.closest('tr');
  if (opt.value) row.querySelector('input[name*="description"]').value = opt.text;
  row.querySelector('input[name*="unit"]').value = opt.dataset.unit || 'NOS';
}
</script>
</body>
</html>
