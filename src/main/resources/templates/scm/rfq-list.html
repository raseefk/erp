<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('RFQ')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('scm-rfq')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Request for Quotation')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <form th:action="@{/admin/scm/rfq}" method="get" class="d-flex gap-2">
          <input type="text" name="q" class="form-control form-control-sm" placeholder="Search RFQs…" th:value="${q}" style="width:250px;"/>
          <button type="submit" class="btn btn-sm btn-gold">Search</button>
        </form>
        <a th:href="@{/admin/scm/rfq/new}" class="btn btn-sm btn-gold"><i class="bi bi-plus-lg me-1"></i>New RFQ</a>
      </div>
      <div class="card card-levanto">
        <div class="card-header"><i class="bi bi-envelope-open-text me-2"></i>Request for Quotation Register</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-levanto mb-0">
              <thead><tr>
                <th>RFQ Number</th><th>Title</th><th>Deadline</th><th>Responses</th><th>Status</th><th>Actions</th>
              </tr></thead>
              <tbody>
                <tr th:each="r : ${rfqPage.content}">
                  <td><strong th:text="${r.rfqNumber}">-</strong></td>
                  <td th:text="${r.title}">-</td>
                  <td th:text="${r.deadline ?: '-'}">-</td>
                  <td><span class="badge bg-info text-dark" th:text="${#lists.size(r.vendorResponses)} + ' responses'">-</span></td>
                  <td>
                    <span class="badge" th:classappend="${
                      r.status.name() == 'DRAFT' ? 'bg-secondary' :
                      r.status.name() == 'SENT' ? 'bg-info text-dark' :
                      r.status.name() == 'RESPONSES_RECEIVED' ? 'bg-warning text-dark' :
                      r.status.name() == 'AWARDED' ? 'bg-success' : 'bg-danger'
                    }" th:text="${r.status}">-</span>
                  </td>
                  <td>
                    <div class="btn-group btn-group-sm">
                      <a th:href="@{/admin/scm/rfq/{id}(id=${r.id})}" class="btn btn-outline-navy" title="View"><i class="bi bi-eye"></i></a>
                      <a th:if="${r.status.name() == 'DRAFT'}" th:href="@{/admin/scm/rfq/{id}/edit(id=${r.id})}" class="btn btn-navy" title="Edit"><i class="bi bi-pencil"></i></a>
                    </div>
                  </td>
                </tr>
                <tr th:if="${rfqPage.totalElements == 0}">
                  <td colspan="6" class="text-center py-4 text-muted">No RFQs found.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
