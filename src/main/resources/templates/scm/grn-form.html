<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('New GRN')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('scm-grn')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('New Goods Receipt Note')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    <div class="mt-1">
      <div class="mb-3"><a th:href="@{/admin/scm/grn}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
      <div class="card card-levanto">
        <div class="card-header"><i class="bi bi-box-seam me-2"></i>Goods Receipt Note</div>
        <div class="card-body">
          <form th:action="@{/admin/scm/grn/save}" method="post" id="grnForm">
            <input type="hidden" name="id" th:value="${grn.id}"/>
            <div class="row g-3 mb-4">
              <div class="col-md-4">
                <label class="form-label fw-bold">Purchase Order *</label>
                <select name="purchaseOrder.id" class="form-select" required id="poSelect" onchange="loadPoDetails(this)">
                  <option value="">-- Select PO --</option>
                  <option th:each="po : ${purchaseOrders}" th:value="${po.id}" th:text="${po.poNumber + ' — ' + po.vendor.name}"
                          th:selected="${grn.purchaseOrder?.id == po.id}"></option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Received Date</label>
                <input type="date" name="receivedDate" class="form-control" th:value="${grn.receivedDate}"/>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">Delivery Challan No</label>
                <input type="text" name="deliveryChallanNo" class="form-control" th:value="${grn.deliveryChallanNo}"/>
              </div>
              <div class="col-md-2">
                <label class="form-label fw-bold">Vehicle No</label>
                <input type="text" name="vehicleNumber" class="form-control" th:value="${grn.vehicleNumber}"/>
              </div>
            </div>
            <div class="col-md-4 mb-4">
              <label class="form-label fw-bold">Received By</label>
              <input type="text" name="receivedBy" class="form-control" th:value="${grn.receivedBy}" placeholder="Store in-charge name"/>
            </div>
            <h6 class="text-navy fw-bold border-bottom pb-1 mb-3"><i class="bi bi-list-check me-2"></i>Items Received</h6>
            <div class="table-responsive">
              <table class="table table-sm table-bordered" id="grnTable">
                <thead class="bg-light"><tr>
                  <th>Description</th><th>Unit</th>
                  <th style="width:10%;">Ordered Qty</th>
                  <th style="width:10%;">Received Qty</th>
                  <th style="width:10%;">Accepted Qty</th>
                  <th style="width:10%;">Rejected Qty</th>
                  <th style="width:12%;">Unit Price (₹)</th>
                  <th>Rejection Reason</th>
                </tr></thead>
                <tbody id="grnBody">
                  <tr th:each="item, stat : ${grn.items}">
                    <input type="hidden" th:name="'items[' + ${stat.index} + '].poItem.id'" th:value="${item.poItem?.id}"/>
                    <input type="hidden" th:name="'items[' + ${stat.index} + '].inventoryItem.id'" th:value="${item.inventoryItem?.id}"/>
                    <td><input type="text" th:name="'items[' + ${stat.index} + '].description'" class="form-control form-control-sm" th:value="${item.description}" required/></td>
                    <td><input type="text" th:name="'items[' + ${stat.index} + '].unit'" class="form-control form-control-sm" th:value="${item.unit}"/></td>
                    <td><input type="number" step="0.001" th:name="'items[' + ${stat.index} + '].orderedQuantity'" class="form-control form-control-sm" th:value="${item.orderedQuantity}" readonly/></td>
                    <td><input type="number" step="0.001" th:name="'items[' + ${stat.index} + '].receivedQuantity'" class="form-control form-control-sm grn-received" th:value="${item.receivedQuantity}" oninput="syncAccepted(this)"/></td>
                    <td><input type="number" step="0.001" th:name="'items[' + ${stat.index} + '].acceptedQuantity'" class="form-control form-control-sm grn-accepted" th:value="${item.acceptedQuantity}"/></td>
                    <td><input type="number" step="0.001" th:name="'items[' + ${stat.index} + '].rejectedQuantity'" class="form-control form-control-sm" th:value="${item.rejectedQuantity ?: 0}"/></td>
                    <td><input type="number" step="0.01" th:name="'items[' + ${stat.index} + '].unitPrice'" class="form-control form-control-sm" th:value="${item.unitPrice}"/></td>
                    <td><input type="text" th:name="'items[' + ${stat.index} + '].rejectionReason'" class="form-control form-control-sm" th:value="${item.rejectionReason}"/></td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(grn.items)}">
                    <td><input type="text" name="items[0].description" class="form-control form-control-sm" required/></td>
                    <td><input type="text" name="items[0].unit" class="form-control form-control-sm" value="NOS"/></td>
                    <td><input type="number" step="0.001" name="items[0].orderedQuantity" class="form-control form-control-sm" value="0"/></td>
                    <td><input type="number" step="0.001" name="items[0].receivedQuantity" class="form-control form-control-sm grn-received" value="1" oninput="syncAccepted(this)"/></td>
                    <td><input type="number" step="0.001" name="items[0].acceptedQuantity" class="form-control form-control-sm grn-accepted" value="1"/></td>
                    <td><input type="number" step="0.001" name="items[0].rejectedQuantity" class="form-control form-control-sm" value="0"/></td>
                    <td><input type="number" step="0.01" name="items[0].unitPrice" class="form-control form-control-sm" value="0.00"/></td>
                    <td><input type="text" name="items[0].rejectionReason" class="form-control form-control-sm"/></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="mt-3">
              <label class="form-label fw-bold">Remarks</label>
              <textarea name="remarks" class="form-control" rows="2" th:text="${grn.remarks}"></textarea>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-gold px-4"><i class="bi bi-send me-1"></i>Submit GRN</button>
              <a th:href="@{/admin/scm/grn}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script>
function syncAccepted(input) {
  const row = input.closest('tr');
  row.querySelector('.grn-accepted').value = input.value;
}
</script>
</body>
</html>
