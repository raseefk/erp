<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(pageTitle=${pageTitle})}"></head>
<style>
  /* ── Permission page overrides ─────────────────────────────── */
  .feat-card { border:none; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.07); overflow:hidden; }
  .feat-header { padding:.85rem 1.1rem; display:flex; align-items:center; justify-content:space-between; }
  .feat-icon  { width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0; }
  .menu-section-label { background:#f8fafc;padding:.45rem 1rem;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#64748b;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0; }
  .perm-row   { display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;border-bottom:1px solid #f1f5f9; }
  .perm-row:last-child { border-bottom:none; }
  .perm-row:hover { background:#fafbfc; }
  .perm-label { font-size:.83rem;font-weight:500;color:#1e2d40;line-height:1.3; }
  .perm-sub   { font-size:.72rem;color:#94a3b8; }
  .form-check-input:checked { background-color:var(--navy-deep);border-color:var(--navy-deep); }
  /* feature colour palette */
  .fc-SALES      { background:rgba(59,130,246,.12);color:#2563eb; }
  .fc-OPERATIONS { background:rgba(16,185,129,.12);color:#059669; }
  .fc-SCM        { background:rgba(245,158,11,.12);color:#d97706; }
  .fc-PROJECTS   { background:rgba(139,92,246,.12);color:#7c3aed; }
  .fc-ASSETS     { background:rgba(239,68,68,.12);color:#dc2626; }
  .fc-CONSTRUCTION{ background:rgba(249,115,22,.12);color:#ea580c; }
  .fc-HR         { background:rgba(236,72,153,.12);color:#db2777; }
  .fc-FINANCE    { background:rgba(20,184,166,.12);color:#0d9488; }
  .fc-ADMIN      { background:rgba(107,114,128,.12);color:#374151; }
  .fc-ADVANCE_PAYMENTS { background:rgba(200,151,42,.12);color:#b45309; }
  .fc-DMS        { background:rgba(14,165,233,.12);color:#0284c7; }
  .fc-SYSTEM     { background:rgba(26,58,92,.12);color:#0f2338; }
  .sticky-bar { position:sticky;top:56px;z-index:90;background:#fff;border-bottom:1px solid #e2e8f0; }
</style>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('roles')}"></th:block>

<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar(${pageTitle})}"></th:block>
  <div class="px-4 py-3">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>

    <form th:action="@{/settings/roles/{id}/permissions(id=${role.id})}" method="POST">

      <!-- ── Sticky top bar ────────────────────────────────────── -->
      <div class="sticky-bar px-2 py-2 mb-4 d-flex justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center gap-3">
          <nav aria-label="breadcrumb" class="mb-0">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="/settings/roles" class="text-decoration-none">Roles</a></li>
              <li class="breadcrumb-item active fw-bold" th:text="${role.name}">Role</li>
            </ol>
          </nav>
          <span class="badge bg-secondary" th:text="${assignedPerms.size()} + ' permissions assigned'">0</span>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selectAll(true)">
            <i class="bi bi-check2-all me-1"></i>Select All
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="selectAll(false)">
            <i class="bi bi-x-circle me-1"></i>Deselect All
          </button>
          <button type="submit" class="btn btn-sm btn-gold px-4 shadow-sm"
                  sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_SETTINGS_ROLES_MANAGE')">
            <i class="bi bi-save2 me-1"></i>Save Changes
          </button>
        </div>
      </div>

      <!-- ── Permission grid ───────────────────────────────────── -->
      <div class="row g-3">

        <div th:each="feature : ${features}" class="col-12 col-md-6 col-xl-4">
          <div class="feat-card h-100">

            <!-- Feature header -->
            <div class="feat-header"
                 th:classappend="'bg-white border-bottom border-2'"
                 style="border-color:#e2e8f0!important;">
              <div class="d-flex align-items-center gap-2 flex-grow-1">
                <div class="feat-icon" th:classappend="'fc-' + ${feature.id}">
                  <i class="bi" th:classappend="'bi-' + (${feature.icon} ?: 'grid')"></i>
                </div>
                <div>
                  <div class="fw-bold" style="font-size:.88rem;color:#0f2338;" th:text="${feature.displayName}">Feature</div>
                  <div th:with="cnt=${#aggregates.sum(feature.menus.![permissions.size()])}"
                       class="text-muted" style="font-size:.7rem;"
                       th:text="${cnt} + ' permissions'">0 permissions</div>
                </div>
              </div>
              <!-- Select-all toggle for this feature -->
              <div class="d-flex align-items-center gap-2">
                <span class="text-muted" style="font-size:.7rem;">All</span>
                <div class="form-check form-switch mb-0">
                  <input class="form-check-input feature-master-toggle"
                         type="checkbox"
                         th:id="${'master-' + feature.id}"
                         th:attr="data-feature=${feature.id}"
                         onclick="toggleFeatureGroup(this)">
                </div>
              </div>
            </div>

            <!-- Menu sections -->
            <div th:each="menu : ${feature.menus}" th:if="${!menu.permissions.isEmpty()}">
              <div class="menu-section-label d-flex align-items-center gap-2">
                <i class="bi" th:classappend="'bi-' + (${menu.icon} ?: 'dot')"></i>
                <span th:text="${menu.displayName}">Menu</span>
                <span class="ms-auto badge bg-secondary rounded-pill" style="font-size:.6rem;"
                      th:text="${menu.permissions.size()}">0</span>
              </div>
              <div th:each="perm : ${menu.permissions}" class="perm-row">
                <label class="perm-label flex-grow-1 me-2" th:for="${perm.id}" style="cursor:pointer;">
                  <span th:text="${perm.displayName}">Permission</span>
                  <div class="perm-sub" th:text="${perm.description ?: perm.id}">id</div>
                </label>
                <div class="form-check mb-0">
                  <input class="form-check-input perm-checkbox"
                         type="checkbox"
                         name="permissions"
                         th:value="${perm.id}"
                         th:id="${perm.id}"
                         th:checked="${assignedPerms.contains(perm.id)}"
                         th:attr="data-feature=${feature.id}">
                </div>
              </div>
            </div>

            <!-- Empty state -->
            <div th:if="${#lists.isEmpty(feature.menus)}"
                 class="p-3 text-center text-muted small">No permissions defined.</div>

          </div><!-- /feat-card -->
        </div><!-- /col -->

      </div><!-- /row -->

      <!-- ── Bottom save ───────────────────────────────────────── -->
      <div class="mt-4 p-4 rounded-3 text-center" style="background:#f8fafc;"
           sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_SETTINGS_ROLES_MANAGE')">
        <p class="text-muted small mb-3">Permissions take effect on next login or token refresh.</p>
        <button type="submit" class="btn btn-gold btn-lg px-5 shadow-sm">
          <i class="bi bi-save2 me-2"></i>Save Permissions
        </button>
      </div>

    </form>
  </div>
</div>

<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script>
  /* Toggle all checkboxes belonging to a feature */
  function toggleFeatureGroup(toggle) {
    const fid = toggle.getAttribute('data-feature');
    document.querySelectorAll('.perm-checkbox[data-feature="' + fid + '"]')
            .forEach(cb => cb.checked = toggle.checked);
  }

  /* Select / deselect every checkbox */
  function selectAll(checked) {
    document.querySelectorAll('.perm-checkbox').forEach(cb => cb.checked = checked);
    document.querySelectorAll('.feature-master-toggle').forEach(cb => cb.checked = checked);
  }

  /* On load: set each feature master toggle based on whether all its perms are checked */
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.feature-master-toggle').forEach(toggle => {
      const fid = toggle.getAttribute('data-feature');
      const boxes = [...document.querySelectorAll('.perm-checkbox[data-feature="' + fid + '"]')];
      toggle.checked = boxes.length > 0 && boxes.every(cb => cb.checked);
      toggle.indeterminate = !toggle.checked && boxes.some(cb => cb.checked);
    });

    /* Keep master toggle in sync as individual boxes change */
    document.querySelectorAll('.perm-checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        const fid = cb.getAttribute('data-feature');
        const master = document.querySelector('.feature-master-toggle[data-feature="' + fid + '"]');
        if (!master) return;
        const boxes = [...document.querySelectorAll('.perm-checkbox[data-feature="' + fid + '"]')];
        master.checked = boxes.every(b => b.checked);
        master.indeterminate = !master.checked && boxes.some(b => b.checked);
      });
    });
  });
</script>
</body>
</html>
