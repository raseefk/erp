<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:insert="~{fragments/layout :: head('Payroll Runs')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('payroll-runs')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Payroll Runs')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h6 class="mb-0 fw-bold"><i class="bi bi-receipt-cutoff me-2"></i>All Payroll Runs</h6>
      <div class="d-flex gap-2" sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_HR_PAYROLL_RUN')">
        <form th:action="@{/admin/payroll/runs/generate}" method="post" class="d-flex gap-2">
          <select name="month" class="form-select form-select-sm" style="width:130px;">
            <option th:each="m : ${months}" th:value="${m.value}" th:text="${m.name()}" th:selected="${m.value == currentMonth}">-</option>
          </select>
          <input type="number" name="year" class="form-control form-control-sm" style="width:90px;" th:value="${currentYear}"/>
          <button type="submit" class="btn btn-gold btn-sm"><i class="bi bi-play me-1"></i>Generate</button>
        </form>
      </div>
    </div>

    <div class="card card-levanto">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-levanto mb-0">
            <thead><tr>
              <th>Period</th><th>Status</th>
              <th>Total Gross</th><th>Total Deductions</th><th>Total Net</th>
              <th>Approved By</th><th>Actions</th>
            </tr></thead>
            <tbody>
              <tr th:each="run : ${runsPage.content}" th:if="${runsPage != null and runsPage.content != null}">
                <td class="fw-bold" th:text="${run.payPeriodLabel ?: '-'}">-</td>
                <td>
                  <span class="badge"
                        th:classappend="${run.status != null and run.status.name() == 'DISBURSED' ? 'bg-success' :
                                         (run.status != null and run.status.name() == 'APPROVED' ? 'bg-primary' :
                                         (run.status != null and run.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-secondary'))}"
                        th:text="${run.status ?: '-'}">-</span>
                </td>
                <td th:text="${run.totalGross != null ? ('&#8377;' + #numbers.formatDecimal(run.totalGross, 1, 'COMMA', 2, 'POINT')) : '&#8377;0.00'}">&#8377;0.00</td>
                <td class="text-danger" th:text="${run.totalDeductions != null ? ('&#8377;' + #numbers.formatDecimal(run.totalDeductions, 1, 'COMMA', 2, 'POINT')) : '&#8377;0.00'}">&#8377;0.00</td>
                <td class="fw-bold text-success" th:text="${run.totalNet != null ? ('&#8377;' + #numbers.formatDecimal(run.totalNet, 1, 'COMMA', 2, 'POINT')) : '&#8377;0.00'}">&#8377;0.00</td>
                <td class="small text-muted" th:text="${run.approvedBy ?: '—'}">-</td>
                <td>
                  <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/payroll/runs/{id}(id=${run.id})}" class="btn btn-outline-navy" title="View Details"><i class="bi bi-eye"></i></a>
                    <button th:if="${run.status != null and run.status.name() == 'DRAFT'}" class="btn btn-outline-primary"
                            th:data-run-id="${run.id}"
                            onclick="approveRun(this.getAttribute('data-run-id'))"
                            sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_HR_PAYROLL_APPROVE')"
                            title="Approve Run">
                      <i class="bi bi-check2"></i>
                    </button>
                    <a th:if="${run.status != null and (run.status.name() == 'APPROVED' or run.status.name() == 'DISBURSED')}"
                       th:href="@{/admin/payroll/runs/{id}/neft(id=${run.id})}"
                       class="btn btn-outline-success" title="Download NEFT File"
                       sec:authorize="hasAnyAuthority('ROLE_SYSTEM_ADMIN','PERM_HR_PAYROLL_DISBURSE')">
                      <i class="bi bi-bank"></i>
                    </a>
                  </div>
                </td>
              </tr>
              <tr th:if="${runsPage == null or runsPage.totalElements == 0}">
                <td colspan="7" class="text-center py-5 text-muted">No payroll runs found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <nav th:if="${runsPage != null and runsPage.totalPages > 1}" class="mt-3">
      <ul class="pagination pagination-sm justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/payroll/runs(page=${currentPage-1})}">Prev</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, runsPage.totalPages - 1)}"
            th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link" th:href="@{/admin/payroll/runs(page=${i})}" th:text="${i+1}">1</a>
        </li>
        <li class="page-item" th:classappend="${currentPage == runsPage.totalPages - 1} ? 'disabled'">
          <a class="page-link" th:href="@{/admin/payroll/runs(page=${currentPage+1})}">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
<script>
function approveRun(id) {
  if (!confirm('Approve this payroll run?')) return;
  fetch('/admin/payroll/runs/' + id + '/approve', { method: 'POST' })
    .then(r => r.json()).then(d => {
      if (d.success) { toast(d.message, 'success'); setTimeout(() => location.reload(), 900); }
      else toast(d.message, 'danger');
    });
}
function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'alert alert-' + type + ' position-fixed top-0 end-0 m-3 shadow';
  t.style.cssText = 'z-index:9999;min-width:260px;'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
