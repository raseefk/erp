spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# ── JPA / Hibernate (Oracle) ──────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none

# ── Liquibase ──────────────────────────────────────────────────────────────────
spring.liquibase.enabled=false
# spring.liquibase.change-log=classpath:db/changelog/master.xml

# ── Thymeleaf ──────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ── Session & Cookie Management ───────────────────────────────────────────────
server.servlet.session.timeout=15m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=SUPERERP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.path=/

# ── Multipart ─────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── JWT Configuration ─────────────────────────────────────────────────────────
app.jwt.secret=super-erp-jwt-secret-key-must-be-256-bits-long-for-hs256-algorithm
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── Caffeine Cache ────────────────────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

# ── Application-Level Admin ───────────────────────────────────────────────────
app.admin.username=admin
app.admin.password=Admin@1234
app.admin.email=admin@supererp.com

# ── Company Details (application-level defaults — overridden by DB CompanySettings) ──
app.company.name=Super ERP
app.company.tagline=Enterprise Resource Planning Simplified
app.company.address=Main Business District, City, State
app.company.phone=+91 XXXXX XXXXX
app.company.email=info@supererp.com
app.company.website=www.supererp.com
app.company.gstNumber=YOUR_GSTIN_HERE
app.company.cgstRate=9
app.company.sgstRate=9

# ── File Upload ───────────────────────────────────────────────────────────────
app.upload.dir=./uploads

# ── Actuator (Health & Monitoring) ────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Super ERP
info.app.description=Comprehensive Single-Tenant ERP System
info.app.version=1.0.0

# ── DB Keepalive Scheduler ────────────────────────────────────────────────────
app.db.keepalive.interval-ms=180000
